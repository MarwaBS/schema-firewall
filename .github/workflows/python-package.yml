name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are disclosed against unchanged pins, so the CVE gate below
  # decays between pushes. The cron re-runs it against the live feed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type-check (mypy)
        run: mypy src tests
      - name: Spell check (codespell)
        run: codespell $(git ls-files '*.md' '*.py' '*.toml' '*.yml' '*.cfg')
      # Freeze first: the project is installed editable, and auditing the
      # environment makes pip-audit fail on this package's own unreleased
      # version rather than on a dependency.
      - name: Dependency CVE gate (pip-audit)
        if: matrix.python-version == '3.13'
        run: |
          pip freeze --exclude-editable > /tmp/deps.txt
          pip-audit --strict --progress-spinner off -r /tmp/deps.txt
      - name: Run pytest
        run: pytest
      # A test weakened to a tautology leaves pytest green; the replay disables each
      # registered behaviour and requires its named tests to go red. One interpreter,
      # because it re-runs pytest per mode and measures the suite, not the runtime.
      - name: Replay planted defects
        if: matrix.python-version == '3.13'
        run: python tools/planted_defects.py
