name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type-check (mypy)
        run: mypy src tests
      - name: Run pytest
        run: pytest
      # A green suite does not show the suite would notice a behaviour going away.
      # The replay disables each registered failure mode in a throwaway copy and
      # requires its named tests to go red, so a test weakened to a tautology
      # fails here while pytest stays green. One interpreter: it re-runs pytest
      # once per registered mode, and what it measures is the suite's grip on the
      # source, which does not vary across the matrix.
      - name: Replay planted defects
        if: matrix.python-version == '3.13'
        run: python tools/planted_defects.py
