name: Release to PyPI

# Tag a release to publish:  git tag v0.1.3 && git push origin v0.1.3
# Requires a repository secret `PYPI_API_TOKEN` (a PyPI API token).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        # A mistagged push (e.g. v0.1.4 on a tree whose pyproject says 0.1.3)
        # must not publish a wheel whose version contradicts its tag.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match pyproject version ${PKG_VERSION}; refusing to publish." >&2
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches pyproject version ${PKG_VERSION}."
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --non-interactive dist/*
