[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-firewall"
version = "0.1.3"
description = "Three checks that catch the leakage + schema bugs that slip past peer review: target-correlated features, schema violations, and state-dependent transforms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Marwa Ben Salem" }]
keywords = ["machine-learning", "data-leakage", "ml-pipeline", "testing", "reproducibility", "schema-validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.0",
    "twine>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/MarwaBS/schema-firewall"
Repository = "https://github.com/MarwaBS/schema-firewall"
Issues = "https://github.com/MarwaBS/schema-firewall/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schema_firewall = ["py.typed"]

[tool.pytest.ini_options]
# Coverage is gated, not just measured: a real floor below the current 92%
# (branch coverage) so a regression that drops a check's branch coverage fails
# CI instead of sliding by. The floor sits a couple points under actual to
# absorb churn without being vacuous.
addopts = "-ra --cov=schema_firewall --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["schema_firewall"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
# Lint the whole repo, not just src/ — tests and examples are first-class code
# and were previously unchecked.

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
